name: Converter regression tests
on:
  push:
    paths:
      - '*.py'
      - '*.cjs'
      - '.github/workflows/regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -v
      - run: node --test *.test.cjs
